experiment_name: "organoids_turco_touching_aug5"
output_base_dir: "runs"
training:
  images_dir: "dat/training_data_aug5/images"
  labels_dir: "dat/training_data_aug5/labels"
  model_type: "vit_b_lm"
  patch_shape: [1024, 1024]  # matches SAM's native encoder input; see chat for reasoning
  batch_size: 6
  n_epochs: 100
  n_samples: null
  learning_rate: 5.0e-5
  early_stopping: 20
  val_split: 0.1
  shuffle_data: true
  shuffle_seed: 42
  train_instance_segmentation_only: false
  normalize_inputs: true
  normalize_lower_percentile: 1.0
  normalize_upper_percentile: 99.5
  use_min_instance_sampler: true
  min_instances_per_patch: 2
  min_instance_size: 100
  save_validation_predictions_frequency: 5
  checkpoint_name: "organoids_turco_touching_aug5_ckpt"
  resume_from_checkpoint: "runs/organoids_turco_touching_aug5/checkpoints/organoids_turco_touching_aug5_ckpt/latest.pt"
  export_path: "runs/organoids_turco_touching_aug5/organoids_turco_touching_aug5_model.pt"
log_level: "INFO"
