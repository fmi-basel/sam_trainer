experiment_name: "organoids_turco_touching_aug5"
output_base_dir: "runs"
augmentation:
  input_images_dir: "dat/training_data/images"
  input_labels_dir: "dat/training_data/labels"
  output_dir: "dat/training_data_aug5"
  output_format: "original"
  n_augmentations: 5
  include_original: true
  treat_3d_as_2d: false
  rotation_range: 90
  flip_horizontal: true
  flip_vertical: true
  allow_rotate_90: true
  gaussian_blur_prob: 0.3
  gaussian_blur_limit: [3, 11]
  gaussian_noise_prob: 0.3
  noise_multiplier_range: [0.95, 1.05]
  brightness_contrast: true
training:
  images_dir: "dat/training_data_aug5/images"
  labels_dir: "dat/training_data_aug5/labels"
  model_type: "vit_b_lm"
  patch_shape: [1024, 1024]  # matches SAM's native encoder input; see chat for reasoning
  batch_size: 6
  n_epochs: 100
  n_samples: null
  num_workers: 12
  learning_rate: 5.0e-5
  early_stopping: 20
  val_split: 0.1
  shuffle_data: true
  shuffle_seed: 42
  train_instance_segmentation_only: false
  normalize_inputs: true
  normalize_lower_percentile: 1.0
  normalize_upper_percentile: 99.5
  use_min_instance_sampler: true
  min_instances_per_patch: 2
  min_instance_size: 25
  save_validation_predictions_frequency: 5
  checkpoint_name: "organoids_turco_touching_aug5_ckpt"
  resume_from_checkpoint: "final_models/organoids_turco_lean.pt"
  export_path: "runs/organoids_turco_touching_aug5/organoids_turco_touching_aug5_model.pt"
log_level: "INFO"
